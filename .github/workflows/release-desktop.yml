name: Build desktop release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Match tag and package version
        run: node scripts/check-release-tag.mjs "${GITHUB_REF_NAME}"

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Create CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx > RadExam-${GITHUB_REF_NAME}-sbom.cdx.json

      - name: Create draft Release and upload SBOM
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          SBOM_FILE: RadExam-${{ github.ref_name }}-sbom.cdx.json
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            if [ "$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "Refusing to overwrite published release ${RELEASE_TAG}."
              exit 1
            fi
            gh release upload "${RELEASE_TAG}" "${SBOM_FILE}" --clobber
          else
            gh release create "${RELEASE_TAG}" "${SBOM_FILE}" \
              --draft \
              --verify-tag \
              --notes-file .github/release-notes.md \
              --title "RadExam ${RELEASE_TAG}"
          fi

  mac:
    name: Build macOS (${{ matrix.arch }})
    needs: validate
    runs-on: macos-14
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        arch:
          - arm64
          - x64
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build desktop runtime
        run: npm run build:desktop

      - name: Build ad-hoc signed macOS packages
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload macOS packages to draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release upload "${RELEASE_TAG}" dist/*.dmg dist/*.zip --clobber

  windows:
    name: Build Windows (x64)
    needs: validate
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build desktop runtime
        run: npm run build:desktop

      - name: Build unsigned Windows packages
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload Windows packages to draft Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release upload "${RELEASE_TAG}" dist/*.exe --clobber

  release:
    name: Create draft GitHub Release
    needs:
      - mac
      - windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out release metadata
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download packages from draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release download "${RELEASE_TAG}" --dir release-assets

      - name: Create SHA-256 checksums
        working-directory: release-assets
        run: find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Attest release artifacts and SBOM when repository supports it
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-assets/*

      - name: Upload checksums to draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release upload "${RELEASE_TAG}" release-assets/SHA256SUMS.txt --clobber
