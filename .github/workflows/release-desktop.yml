name: Build desktop release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Match tag and package version
        run: node scripts/check-release-tag.mjs "${GITHUB_REF_NAME}"

      - name: Validate desktop OAuth configuration
        shell: bash
        env:
          NEXT_PUBLIC_GOOGLE_DESKTOP_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
          NEXT_PUBLIC_MICROSOFT_DESKTOP_CLIENT_ID: ${{ vars.NEXT_PUBLIC_MICROSOFT_DESKTOP_CLIENT_ID }}
        run: |
          missing=0
          for name in NEXT_PUBLIC_GOOGLE_DESKTOP_CLIENT_ID GOOGLE_DESKTOP_CLIENT_SECRET NEXT_PUBLIC_MICROSOFT_DESKTOP_CLIENT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::GitHub Actions setting ${name} is not configured."
              missing=1
            fi
          done
          exit "${missing}"

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Create draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            if [ "$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "Refusing to overwrite published release ${RELEASE_TAG}."
              exit 1
            fi
          else
            gh release create "${RELEASE_TAG}" \
              --draft \
              --verify-tag \
              --notes-file .github/release-notes.md \
              --title "RadExam ${RELEASE_TAG}"
          fi

  mac:
    name: Build macOS (${{ matrix.arch }})
    needs: validate
    runs-on: macos-14
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            label: Apple-Silicon
          - arch: x64
            label: Intel
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build desktop runtime
        run: npm run build:desktop
        env:
          NEXT_PUBLIC_GOOGLE_DESKTOP_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
          NEXT_PUBLIC_MICROSOFT_DESKTOP_CLIENT_ID: ${{ vars.NEXT_PUBLIC_MICROSOFT_DESKTOP_CLIENT_ID }}

      - name: Build ad-hoc signed macOS packages
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Rename macOS package for users
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mv "dist/RadExam-${version}-macOS-${{ matrix.arch }}.dmg" "dist/RadExam-${version}-macOS-${{ matrix.label }}.dmg"

      - name: Upload macOS packages to draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release upload "${RELEASE_TAG}" dist/*.dmg --clobber

  windows:
    name: Build Windows (x64)
    needs: validate
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build desktop runtime
        run: npm run build:desktop
        env:
          NEXT_PUBLIC_GOOGLE_DESKTOP_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
          NEXT_PUBLIC_MICROSOFT_DESKTOP_CLIENT_ID: ${{ vars.NEXT_PUBLIC_MICROSOFT_DESKTOP_CLIENT_ID }}

      - name: Build unsigned Windows packages
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload Windows packages to draft Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release upload "${RELEASE_TAG}" dist/*.exe --clobber

  release:
    name: Create draft GitHub Release
    needs:
      - mac
      - windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download packages from draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release download "${RELEASE_TAG}" --dir release-assets

      - name: Create SHA-256 checksums
        working-directory: release-assets
        run: find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Attest release artifacts when repository supports it
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-assets/*

      - name: Upload checksums to draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release upload "${RELEASE_TAG}" release-assets/SHA256SUMS.txt --clobber
